# 911 Fiesta V7 - SHOW autologin drop-in for getty@tty1
#
# Enables automatic login for fiesta911 on TTY1.
# No password prompt, no display manager, no GDM.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/getty@tty1.service.d/
#   sudo cp /opt/911fiesta/systemd/show-getty-autologin.conf \
#           /etc/systemd/system/getty@tty1.service.d/autologin.conf
#   sudo systemctl daemon-reload
#
# Verify:
#   systemctl cat getty@tty1.service  (should show the drop-in)

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin fiesta911 --noclear %I $TERM
