<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>911 Fiesta — Calendar</title>
    <link rel="stylesheet" href="control-room.css">
</head>
<body>
    <div class="bg-canvas">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="noise"></div>

    <div class="app">
        <aside class="side">
            <div class="s-logo"><span>911</span></div>
            <button class="s-btn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
            <button class="s-btn on"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
            <button class="s-btn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg></button>
            <div style="margin-top: auto; margin-bottom: 8px;"><div class="led-dot"></div></div>
        </aside>

        <main class="main" style="margin-left: 68px;">
            <div style="padding: 20px 28px;">
                <h1 style="font-family: var(--font-title); font-size: 24px; font-weight: 700;">Calendar</h1>
            </div>

            <div class="sub-nav">
                <div class="sub-tab on">Estado</div>
                <div class="sub-tab">Semana</div>
                <div class="sub-tab">Mes</div>
            </div>

            <div style="flex: 1; padding: 0 28px 28px;">
                <div style="display: flex; gap: 14px; margin-bottom: 20px;">
                    <div class="g" style="flex: 0 0 280px;">
                        <div class="green" style="font-family: var(--font-title); font-size: 48px; font-weight: 800;">{{TIME}}</div>
                        <div class="t2 text-sm mt-2">{{DATE}}</div>
                    </div>

                    <div class="g" style="flex: 1;">
                        <div style="display: flex; gap: 20px;">
                            <div style="flex: 1;">
                                <div class="t4 text-sm mb-2">MODE</div>
                                <div class="cyan" style="font-size: 22px; font-weight: 700;">{{MODE}}</div>
                            </div>
                            <div style="width: 1px; background: rgba(255,255,255,0.06);"></div>
                            <div style="flex: 1;">
                                <div class="t4 text-sm mb-2">NEXT BLOCK</div>
                                <div class="green" style="font-size: 22px; font-weight: 700;">{{NEXT_BLOCK}}</div>
                            </div>
                        </div>
                    </div>

                    <div class="gp" style="flex: 0 0 200px;">
                        <div class="t3 text-sm mb-3">MODULES</div>
                        <div style="display: flex; align-items: center; gap: 8px; padding: 5px 0;">
                            <div class="led-dot"></div>
                            <span class="text-sm t2">Bajada</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px; padding: 5px 0;">
                            <div class="led-dot"></div>
                            <span class="text-sm t2">Base Golpe</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px; padding: 5px 0;">
                            <div class="led-dot off"></div>
                            <span class="text-sm t2 opacity-50">Ataque</span>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 0; height: 600px;">
                    <div class="day-strip">
                        <div style="padding: 16px; text-align: center;">
                            <div class="t3" style="font-family: var(--font-title); font-size: 13px; font-weight: 700;">LUN</div>
                            <div class="t4" style="font-family: var(--font-title); font-size: 28px; font-weight: 800; margin-top: 4px;">12</div>
                            <div class="b gray" style="margin-top: 6px; font-size: 9px;">0</div>
                        </div>
                    </div>
                    <div class="day-strip today">
                        <div style="padding: 16px; text-align: center;">
                            <div class="green" style="font-family: var(--font-title); font-size: 13px; font-weight: 700;">MAR</div>
                            <div class="green" style="font-family: var(--font-title); font-size: 28px; font-weight: 800; margin-top: 4px;">13</div>
                            <div class="b" style="margin-top: 6px; font-size: 9px;">3</div>
                            <div class="led-dot" style="margin: 8px auto 0;"></div>
                        </div>
                    </div>
                    <div class="day-strip">
                        <div style="padding: 16px; text-align: center;">
                            <div class="t3" style="font-family: var(--font-title); font-size: 13px; font-weight: 700;">MIE</div>
                            <div class="t4" style="font-family: var(--font-title); font-size: 28px; font-weight: 800; margin-top: 4px;">14</div>
                            <div class="b gray" style="margin-top: 6px; font-size: 9px;">1</div>
                        </div>
                    </div>
                    <div class="day-strip">
                        <div style="padding: 16px; text-align: center;">
                            <div class="t3" style="font-family: var(--font-title); font-size: 13px; font-weight: 700;">JUE</div>
                            <div class="t4" style="font-family: var(--font-title); font-size: 28px; font-weight: 800; margin-top: 4px;">15</div>
                            <div class="b gray" style="margin-top: 6px; font-size: 9px;">0</div>
                        </div>
                    </div>
                    <div class="day-strip">
                        <div style="padding: 16px; text-align: center;">
                            <div class="t3" style="font-family: var(--font-title); font-size: 13px; font-weight: 700;">VIE</div>
                            <div class="t4" style="font-family: var(--font-title); font-size: 28px; font-weight: 800; margin-top: 4px;">16</div>
                            <div class="b gray" style="margin-top: 6px; font-size: 9px;">2</div>
                        </div>
                    </div>
                    <div class="day-strip">
                        <div style="padding: 16px; text-align: center;">
                            <div class="t3" style="font-family: var(--font-title); font-size: 13px; font-weight: 700;">SAB</div>
                            <div class="t4" style="font-family: var(--font-title); font-size: 28px; font-weight: 800; margin-top: 4px;">17</div>
                            <div class="b gray" style="margin-top: 6px; font-size: 9px;">5</div>
                        </div>
                    </div>
                    <div class="day-strip" style="border-right: none;">
                        <div style="padding: 16px; text-align: center;">
                            <div class="t3" style="font-family: var(--font-title); font-size: 13px; font-weight: 700;">DOM</div>
                            <div class="t4" style="font-family: var(--font-title); font-size: 28px; font-weight: 800; margin-top: 4px;">18</div>
                            <div class="b gray" style="margin-top: 6px; font-size: 9px;">1</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
