<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00c864;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a850;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Glow externo -->
  <rect x="40" y="40" width="120" height="120" rx="28" fill="url(#logoGrad)" opacity="0.3" filter="url(#shadow)"/>
  
  <!-- Base del logo -->
  <rect x="40" y="40" width="120" height="120" rx="28" fill="url(#logoGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Highlight superior -->
  <rect x="48" y="44" width="104" height="42" rx="18" fill="url(#highlight)"/>
  
  <!-- Texto "911" -->
  <text x="100" y="125" font-family="'JetBrains Mono', monospace" font-size="48" font-weight="900" fill="#0a1a10" text-anchor="middle" dominant-baseline="middle">911</text>
</svg>