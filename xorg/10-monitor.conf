# 911 Fiesta V7 - SHOW Xorg Monitor Configuration
#
# Forces 1920x1080 at Xorg level BEFORE any application starts.
# This ensures Qt/PySide6 sees the correct physical framebuffer size
# from the very first frame — no runtime xrandr or DPI hacks needed.
#
# Install:
#   sudo mkdir -p /etc/X11/xorg.conf.d/
#   sudo cp /opt/911fiesta/xorg/10-monitor.conf /etc/X11/xorg.conf.d/
#
# Note: This is a partial config (xorg.conf.d snippet), not a full xorg.conf.
# Xorg merges it with auto-detected settings. Safe on any GPU (NVIDIA, Intel, etc).

Section "Monitor"
    Identifier "Monitor0"
    Option     "PreferredMode" "1920x1080"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Device0"
    Monitor     "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "1920x1080"
    EndSubSection
EndSection
