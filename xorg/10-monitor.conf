# 911 Fiesta V7 - SHOW Xorg Monitor Configuration
#
# Preferred resolution: 1920x1080 at Xorg framebuffer level.
# Driver-agnostic: works with modesetting, nvidia, intel, amdgpu.
#
# Xorg auto-detects the GPU driver. DO NOT hardcode Driver "nvidia"
# because it breaks startx on machines where the NVIDIA proprietary
# driver is not loaded (e.g. fresh install, nouveau, Intel iGPU).
#
# Install:
#   sudo mkdir -p /etc/X11/xorg.conf.d/
#   sudo cp /opt/911fiesta/xorg/10-monitor.conf /etc/X11/xorg.conf.d/
#
# Rollback:
#   sudo rm /etc/X11/xorg.conf.d/10-monitor.conf
#   (Xorg reverts to full auto-detection on next startx)

Section "Monitor"
    Identifier "Monitor0"
    Option     "PreferredMode" "1920x1080"
    Option     "DPMS"          "false"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Monitor     "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080"
    EndSubSection
EndSection
