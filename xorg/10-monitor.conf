# 911 Fiesta V7 - SHOW Xorg Monitor + GPU Configuration
#
# Forces 1920x1080 at Xorg framebuffer level BEFORE any application starts.
# Designed for NVIDIA proprietary driver (GTX 1080 Ti / similar).
#
# Key: NVIDIA ignores standard Modes — it uses "metamodes" instead.
# The Device section MUST exist for the Screen→Device binding to work.
#
# Install:
#   sudo mkdir -p /etc/X11/xorg.conf.d/
#   sudo cp /opt/911fiesta/xorg/10-monitor.conf /etc/X11/xorg.conf.d/
#
# Rollback:
#   sudo rm /etc/X11/xorg.conf.d/10-monitor.conf
#   (Xorg reverts to auto-detection on next startx)

Section "Device"
    Identifier "Device0"
    Driver     "nvidia"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    Option     "PreferredMode" "1920x1080"
    Option     "DPMS"          "false"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Device0"
    Monitor     "Monitor0"
    DefaultDepth 24
    Option      "metamodes" "1920x1080_60 +0+0"
    SubSection "Display"
        Depth   24
        Modes   "1920x1080"
        Virtual 1920 1080
    EndSubSection
EndSection
